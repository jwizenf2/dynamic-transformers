[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "dynamic-transformers"
version = "0.1.0"
description = "Independent, provenance-aware reproduction of contextual-bandit DHT"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.2,<3",
    "torch>=2.6,<3",
    "pydantic>=2.10,<3",
    # Tool-calling routing (MLX inference for Qwen3.5/3.8 hybrid models). Base dependencies, not
    # an extra, because the ai-lab job runner syncs only the default dependency set.
    "mlx-lm>=0.32.0,<0.33; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "huggingface-hub>=1.0,<2.1",
    # Ouro looped LM on MLX (Apache-2.0 port), pinned to a reviewed commit.
    "ouro-mlx; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
nlp = ["tokenizers>=0.21,<1", "safetensors>=0.5,<1"]
analysis = [
    "ipykernel>=6.29,<8",
    "matplotlib>=3.9,<4",
    "nbclient>=0.10,<1",
    "nbformat>=5.10,<6",
    "pandas>=2.2,<3",
]

[project.scripts]
dht = "dht.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/dht"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Exploratory analysis notebooks: long table/plot lines and plain zip() are fine.
"notebooks/*.ipynb" = ["E501", "B905", "B007"]

[tool.uv]
cache-dir = ".cache/uv"

[tool.uv.sources]
ouro-mlx = { git = "https://github.com/GeorgiyDemo/ouro-mlx", rev = "e10e753a6e34ed5b6ce167aff6ed47f0d6fb6d44" }
