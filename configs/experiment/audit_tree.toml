# Bounded synthetic training diagnostic, not a paper reproduction experiment.
name = "training_audit"
seed = 7
device = "cpu"
steps = 300
batch_size = 8
learning_rate = 0.001
cpu_threads = 1

[model]
dropout = 0.1

[data]
train_size = 256
validation_size = 128
test_size = 128
sequence_length = 8

[dht]
mode = "tree"
depths = [1, 2, 3]
head_counts = [2, 4]
calibration_samples = 32
feedback_rule = "paper_literal"
