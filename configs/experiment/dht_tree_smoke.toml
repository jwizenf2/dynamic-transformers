# Independent T-DHT mechanics on a tiny CPU model; not published results.
name = "tree_dht_cpu"
seed = 7
device = "cpu"
steps = 8
batch_size = 3
learning_rate = 0.001

[model]
dropout = 0.1

[dht]
mode = "tree"
depths = [1, 2, 3]
head_counts = [2, 4]
calibration_samples = 8
# Preserve the p.444 equation. Use "improvement" only as a labeled correction.
feedback_rule = "paper_literal"
reward_cap = 100.0
